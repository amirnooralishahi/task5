name: Continuous Deployment on Tag

# -----------------
# 1. Trigger
# -----------------
# Workflow زمانی اجرا می‌شود که یک تگ جدید به سرور ریموت پوش شود.
# این الگو تگ‌هایی مانند v1.0.0 یا v2.1.5 را شامل می‌شود.
on:
  push:
    tags:
      - 'v*.*.*'

# -----------------
# 2. Jobs
# -----------------
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

    # الف) دانلود کد ریپوزیتوری روی محیط Runner گیت‌هاب
    - name: Checkout Code
      uses: actions/checkout@v4

    # ب) تنظیم محیط Python
    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        # ورژن پایتون مورد استفاده در پروژه (باید با سرور سازگار باشد)
        python-version: '3.11'

    # ج) نصب وابستگی‌های پروژه (اختیاری، اما توصیه می‌شود)
    # این مرحله می‌تواند برای اجرای تست‌ها هم مفید باشد، اما برای دپلوی SSH معمولا اختیاری است.
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt # اگر دارید

    # د) اجرای دپلوی از طریق SSH
    - name: Deploy to Linux Server via SSH
      # استفاده از یک اکشن آماده برای اتصال SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        # متغیرها از Secrets گیت‌هاب خوانده می‌شوند
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22

        # دستوراتی که مستقیماً در سرور لینوکس اجرا می‌شوند
        script: |
          echo "Starting deployment for tag: ${{ github.ref_name }}"
          
          # 1. رفتن به مسیر پروژه در سرور
          # 🚨 این مسیر را حتماً با مسیر واقعی پروژه در سرور جایگزین کنید 
          PROJECT_DIR="/var/www/your-project-name" 
          cd $PROJECT_DIR
          
          # 2. دریافت کدهای جدید (پول کردن تگ پوش‌شده)
          # این دستور تغییرات را از گیت‌هاب به سرور لینوکس منتقل می‌کند.
          git fetch origin
          git checkout ${{ github.ref_name }}
          
          # 3. نصب وابستگی‌های جدید (اگر در طول زمان تغییر کرده‌اند)
          /usr/bin/python3 -m pip install -r requirements.txt
          
          # 4. ری‌استارت سرویس FastAPI 
          # 🚨 نام سرویس systemd یا supervisor خود را جایگزین کنید
          sudo systemctl restart fastapi-parcel.service 
          
          echo "Deployment finished. Service restarted."