name: Python CI/CD (FastAPI) # نامی که در تب Actions نمایش داده می‌شود

on:
  push:
    branches: [ "main", "develop" ] # اجرا هنگام push به شاخه‌های اصلی
  pull_request:
    branches: [ "main", "develop" ] # اجرا هنگام باز شدن یا به‌روزرسانی Pull Request
  workflow_dispatch: # اجازه اجرای دستی را فراهم می‌کند

jobs:
  # نام Job: اجرای تست‌ها و بررسی کیفیت کد
  build-and-test:
    # تعیین سیستم عامل (Runner) برای اجرای Job
    runs-on: ubuntu-latest

    steps:
      # مرحله ۱: بررسی کد (Checkout)
      - name: Checkout repository
        uses: actions/checkout@v4 # این اکشن کد شما را روی Runner بارگذاری می‌کند

      # مرحله ۲: تنظیم محیط پایتون
      - name: Set up Python 3.10
        uses: actions/setup-python@v5 # اکشن برای تنظیم محیط پایتون
        with:
          python-version: "3.10" # می‌توانید نسخه دلخواه خود را تعیین کنید

      # مرحله ۳: نصب وابستگی‌ها
      # فرض می‌کنیم فایل requirements.txt شامل تمام کتابخانه‌های مورد نیاز (مانند FastAPI، Uvicorn، pytest) است.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # اگر از poetry یا pipenv استفاده می‌کنید، دستورات نصب متفاوتی را اینجا می‌زنید.

      # مرحله ۴: اجرای تست‌های واحد (Unit Tests)
      # 🚨 توجه: شما باید فایل‌های تست (مانند test_*.py) داشته باشید تا این مرحله اجرا شود.
      - name: Run Tests
        run: |
          # 💡 اگر از Pytest استفاده می‌کنید:
          pip install pytest # نصب ابزار تست
          pytest # دستور اجرای تست‌ها

      # مرحله ۵: بررسی کیفیت کد (Linting/Formatting)
      # استفاده از ابزارهایی مانند flake8 برای بررسی سینتکس و استایل کد
      - name: Lint Code with Flake8
        run: |
          pip install flake8
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

