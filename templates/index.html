

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous">
            <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
            <link rel="stylesheet" href="style.css">
    </head>
    <body class="overflow-hidden">
        <div class="header">
            <div class="header-contains">
                <div class="add-item d-flex gap-5">
                    <div class="add-item-container d-flex flex-column gap-4">
                        <span class="text-center">اضافه کردن آیتم </span>
                        <div class="form">
                            <form action="index.html" id="parcel"
                                class="row d-flex gap-2 justify-content-center align-items-center">
                                <div class="col-6 d-flex gap-2">
                                    <label for="vendor_id">vendor_id</label>
                                    <input type="number" id='vendor_id'
                                        name="vendor_id">

                                    <label for="customer_id">customer_id</label>
                                    <input type="number" id="customer_id"
                                        name="customer_id">

                                    <label for="invoice">invoice-id</label>
                                    <input type="number" id='invoice'
                                        name="invoice">
                                </div>
                                <div class="col-6 d-flex gap-2">
                                    <label for="status">status</label>
                                    <input type="text" id="status"
                                        name="status">

                                    <label for="count">count</label>
                                    <input type="number" id="count"
                                        name='count'>

                                    <label for="product_id">product_id</label>
                                    <input type="text" id='product_id'
                                        name="product_id">
                                </div>
                                <button type="submit">ثبت مرسوله</button>

                            </form>

                        </div>
                        <br>
                        <hr>
                    </div>

                </div>
                     <div class="customer">
                    <div class="customer-container">
                        <form action="index.html" id="form-name">
                        <div class="name">
                            <label for="name">first_name</label>
                            <input type="text" id="name" name="name">
                        </div>
                        <div class="last_name">
                            <label for="last_name">last_name</label>
                            <input type="text" id="last_name" name="last_name">
                        </div>
                        <div class="list_product d-flex gap-3 " id="product_list_container">
                        </div>
                        </form>
                    </div>
                   </div>
                   <hr>
                   <br>
                   <div class="parcel-customer">
                    <div class="parcel-customer-container" id="parcel-customer">
                        <div>
                            <div class="d-flex justify-content-center align-content-center ">
                                <h3>نمایش لیست محصولات کاربر</h3>
                            </div>
                            <form action="" id="product-customer">
                            <label for="name" >first_name</label>
                            <input type="text"name='name' >
                            <label for="last_name">last_name</label>
                            <input type="text"name='last_name'>
                            <button type="submit" class="but">ثبت مرسوله</button>
                            </form>
                        </div>
                    </div>
                   </div>
              

                </div>
            </div>
        </div>

        <div class="cancel">
            <div class="cancel-container d-flex gap-3">
                <div class="totalPrice" id="cancelPrice">

                </div>
                <div class="name" id="cancelName"></div>
                <div id="cancelCount">

                </div>
                <div id="cancelStatus"></div>
            </div>
        </div>

        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>

    </body>
    <script src="script.js"></script>
</html>
