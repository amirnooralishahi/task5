<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body class="overflow-x-hidden">
    <div class="header">
        <div class="header-contains">
            <div class="add-item d-flex gap-5">
                <div class="add-item-container d-flex flex-column gap-4">
                    <span class="text-center">اضافه کردن آیتم </span>
                    <div class="form">
                        <form action="index.html" id="parcel"
                            class="row d-flex gap-2 justify-content-center align-items-center">
                            <div class="col-6 d-flex gap-2">
                                <label for="vendor_id">vendor_id</label>
                                <input type="number" id='vendor_id' name="vendor_id">

                                <label for="customer_id">customer_id</label>
                                <input type="number" id="customer_id" name="customer_id">

                                <label for="invoice">invoice-id</label>
                                <input type="number" id='invoice' name="invoice">
                            </div>
                            <div class="col-6 d-flex gap-2">
                                <label for="status">status</label>
                                <input type="text" id="status" name="status">

                                <label for="count">count</label>
                                <input type="number" id="count" name='count'>

                                <label for="product_id">product_id</label>
                                <input type="text" id='product_id' name="product_id">
                            </div>
                            <button type="submit">ثبت مرسوله</button>

                        </form>

                    </div>
                    <br>
                    <hr>
                </div>

            </div>



        </div>
    </div>
    </div>
    <div class="customer">
        <div class="customer-container  ">
            
            <form action="index.html" id="form-name">
                <div class="name">
                    <label for="name">first_name</label>
                    <input type="text" id="name" name="name">
                </div>
                <div class="last_name">
                    <label for="last_name">last_name</label>
                    <input type="text" id="last_name" name="last_name">
                </div>
                
            </form>
            <div class="list_product " id="product_list">
                    <div  id="product_list_container" class="d-flex border border-black">

                    </div>
                    <button class="confirmListProduct">click me</button>
                </div>
        </div>
    </div>
    <hr>
    <br>
    
    <div class="parcel-customer">
        <div class="parcel-customer-containe d-flex flex-column w-100 gap-5" id="parcel-customer">
            <div class="w-100 col-6 d-flex flex-column align-items-center gap-3 ">
                <div class="d-flex justify-content-center align-content-center ">
                    <h3>نمایش لیست محصولات کاربر</h3>
                </div>
                <form action="" id="product-customer">
                    <label for="name">first_name</label>
                    <input type="text" name='name'>
                    <label for="last_name">last_name</label>
                    <input type="text" name='last_name'>
                    <button type="submit" class="but">ثبت مرسوله</button>
                </form>
            </div>
            <div id="show-product" class="w-100 col-6 d-flex flex-column gap-3  mb-5 ">

            </div>
        </div>
    </div>

    <div class="vendor d-flex flex-column align-items-center">
        <div class="row vendor-container  gap-5">
            <h3 class="text-center">نمایش سفارش های غرفه دار</h3>
            <div class="col-12 d-flex justify-content-center" id="vendor-form">
                <form action="" id='name-vendor'>
                    <label for="name">name</label>
                    <input type="text" id="name" name="name">
                    <label for="last_name">last_name</label>
                    <input type="text" id="last_name" name="last_name">
                    <button class="vendorButton">کلیک کن </button>
                </form>
            </div>
            <div class="row d-flex border border-black w-100" id="show-parcel">

            </div>
            <div id="confrim-pro" class="row">

            </div>
        </div>
    </div>
 
    <div id="cancel-parcel" class="">
        <div id="cancel-parcel-container" class=" d-flex flex-column align-items-center gap-5">
            <h3> لطفا شماره سفارش را برای کنسل کردن وارد کنید</h3>
            <form action="" id='get_name'>
                <label for="name">first_name</label>
                <input type="text" name="name">
                <label for="last_name">last_name</label>
                <input type="text" name='last_name'>
            </form>
            <form action="" id="cancle-form-parcel">
                <label for="parcel_id">number_parcel</label>
                <input type="number" name="parcel_id"  id="cancel-parcel-input">
                <button class="submit-cancel-parcel">click me </button>
            </form>
            <div id="show_detail" class='d-flex  border border-black mt-3'></div>
        </div>
    </div>
    <hr>
    <div id="cancel-invoice">
        <div id="cancel-invoice-container" class=" d-flex flex-column align-items-center gap-5">
            <h3> لطفا شماره سفارش کلی را وارد کنید</h3>
            <form action="" id='get_name_invoice'>
                <label for="name">first_name</label>
                <input type="text" name="name">
                <label for="last_name">last_name</label>
                <input type="text" name='last_name'>
            </form>
            <form action="" id="cancle-form_invoice">
                <label for="invoice">number_invoice</label>
                <input type="datetime" name="invoice_id" id="cancel-invoice-input">
                <button class="submit-cancel">click me </button>
            </form>
            <div id="show_detail_invoice" class='d-flex  border border-black mt-3'></div>
        </div>
    </div>

    <div class="show-vendor border ">
        <div class="show-vendor-container d-flex flex-column align-items-center gap-3" id="show-vendor">
            <div>
                <h3>نام غرفه دار </h3>
                <form action="" id='name-vendor-form'>

                    <button class="showVendor">list vendor</button>
                </form>
            </div>
            <div class=" d-flex flex-column  ">
                <div id="show" class="row d-flex p-2"></div>
                <div id="show-share" class="d-flex">
                    <form action="" id="form_vendor_share">
                        <label for="vendorShare">share_company</label>
                        <input type="number" name="vendorShare" id="vendorShare">
                        <button class="submitShare">click me</button>
                    </form>
                </div>
                <div id="list">

                </div>
                <div id="show-share-vendor"></div>
            </div>

        </div>
    </div>
    
    
    <div class="send-parcel">
        <div class="send-parcel-container"> 
            <form action="" id="sendParcel">
                <label for="name">first_name</label>
                <input type="text" name="name">
                <label for="last_name">last_name</label>
                <input type="text" name="last_name">
                <button class="send-click">click me</button>
            </form>
            <div id="showSend" class="d-flex flex-column">

            </div>
            
        </div>
    </div>


    <div class="check-parcel">
        <div class="check-parcel-container">
            <h3>چک کردن زمان تایید محصولات غرفه دار </h3>
            <div class="checkVendorForm d-flex justify-content-center">
                    <form action="" id="checkParcel">
                        <label for="name">first_name</label>
                        <input type="text" name="name">
                        <label for="last_name">last_name</label>
                        <input type="text" name="last_name">
                        <button class="send-name">click me</button>
                    </form>
                    <div id="showing"></div>
            </div>
             <div class="row d-flex border border-black w-100" id="show-parcel-check">




            
            </div>
            <div id="chekckListVendor">
          <form action="" id="form-parcel-check" class="overflow-hidden" style="display: none;">
                <label for="number">time</label>
                <input type="number" name="number">
                <button class=" overflow-hidden" id="send-num">click me</button>
          </form>
</div>
            <div id="showList" class="d-flex flex-column">

            </div>
        </div>
    </div>

    <div class="add-product mt-5">
        <div id="productView" class="add-product-container d-flex flex-column align-items-center"> 
            <h3> افزودن محصول </h3>
            <div class="formProduct" >
 
                <form  class="d-flex gap-3" id="form-product">
                    <div class="d-flex flex-column">
                    <label for="name">first_name</label>
                    <input type="text" name="name">
                    <label for="last_name">last_name</label>
                    <input type="text" name="last_name">
                    </div>
                    <div class="adding d-flex flex-column gap-3">
                    <label for="nameProduct">name_product</label>
                    <input type="text" name="nameProduct">
                    <label for="number">number </label>
                    <input type="number" name="number">
                    <label for="price">price</label>
                    <input type="number" name="price">
                    </div>
                    <button class="sendInfo">click me</button>
                </form>
             </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

</body>
<script src="script.js"></script>
<script src="cancle.js"></script>
<script src="vendor.js"></script>

</html>
